
name: SMOOTH Agent

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: smooth-agent
  cancel-in-progress: false

jobs:
  agent:
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Run SMOOTH agent
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          python3 agent/run_agent.py

      - name: Publish report to agent branch
        run: |
          set -euo pipefail

          git config user.name "smooth-agent[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          BRANCH="agent/run-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          git switch -c "$BRANCH"

          git add agent/REPORT.md

          if git diff --cached --quiet; then
            echo "No report changes."
            exit 0
          fi

          git commit -m "docs(agent): generate repository report"
          git push -u origin "$BRANCH"

          echo "Published branch: $BRANCH"
