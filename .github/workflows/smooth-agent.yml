name: SMOOTH Agent

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: smooth-agent
  cancel-in-progress: false

jobs:
  agent:
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Run SMOOTH coding agent
        id: coding
        continue-on-error: true
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          python3 agent/run_agent.py

      - name: Publish agent changes
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          BRANCH="agent/run-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"

          git switch -c "$BRANCH"

git add -- agent/REPORT.md app/src/main/ app/src/test/ app/src/androidTest/

          if git diff --cached --quiet; then
            echo "No changes to publish."
            exit 0
          fi

          git commit -m "feat(agent): autonomous coding attempt"
          git push -u origin "$BRANCH"

          echo "Published branch: $BRANCH"

      - name: Check agent result
        if: steps.coding.outcome == 'failure'
        run: |
          echo "Coding agent failed. Check logs and published changes."
          exit 1
