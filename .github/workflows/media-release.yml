name: Smooth Media Interim Release

on:
  push:
    tags:
      - 'smooth-media-p01-*-interim-v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      SMOOTH_SIGNING_KEY_ALIAS: smooth-shell

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'

      - name: Decode release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.SMOOTH_SIGNING_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          test -n "$KEYSTORE_BASE64"
          KEYSTORE="$RUNNER_TEMP/smooth-media-release.jks"
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE"
          chmod 600 "$KEYSTORE"
          echo "SMOOTH_SIGNING_STORE_FILE=$KEYSTORE" >> "$GITHUB_ENV"

      - name: Build signed release APK
        env:
          SMOOTH_SIGNING_STORE_PASSWORD: ${{ secrets.SMOOTH_SIGNING_STORE_PASSWORD }}
          SMOOTH_SIGNING_KEY_PASSWORD: ${{ secrets.SMOOTH_SIGNING_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$SMOOTH_SIGNING_STORE_PASSWORD"
          test -n "$SMOOTH_SIGNING_KEY_PASSWORD"
          EXPECTED_VERSION="${GITHUB_REF_NAME#smooth-media-p01-10c-interim-}"
          ACTUAL_VERSION="$(sed -n 's/.*versionName = "\([^"]*\)".*/\1/p' app/build.gradle.kts)"
          test "$ACTUAL_VERSION" = "$EXPECTED_VERSION"
          chmod +x ./gradlew
          ./gradlew :app:assembleRelease --console=plain

      - name: Verify signature and prepare checksum
        env:
          EXPECTED_CERT: aae94f1d5de956e242ddfe7515ae8684600fc47c772bb4b3fb97d31c54f9d93c
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/release/app-release.apk"
          test -f "$APK"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -n 1)"
          test -n "$APKSIGNER"
          "$APKSIGNER" verify "$APK"
          ACTUAL="$("$APKSIGNER" verify --print-certs "$APK" | grep 'certificate SHA-256 digest:' | tail -n 1 | sed 's/.*digest: //' | tr -d '\r' | tr '[:upper:]' '[:lower:]')"
          test "$ACTUAL" = "$EXPECTED_CERT"
          AAPT="$(find "$ANDROID_HOME/build-tools" -name aapt -type f | sort -V | tail -n 1)"
          test -n "$AAPT"
          "$AAPT" dump badging "$APK" | grep -F "package: name='com.theemrock.smoothmedia'"
          mkdir -p dist
          cp "$APK" "dist/Smooth-Media-${GITHUB_REF_NAME#smooth-media-p01-10c-interim-}.apk"
          cd dist
          sha256sum *.apk > "$(basename *.apk).sha256"

      - name: Create GitHub prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cat > release-notes.md <<'EOF'
          # Smooth Media interim pre-release

          P01-10C checkpoint sonrası ara sürüm. P01 tamamlanmış sayılmaz.

          - P01-09 metadata okuyamayan 8 dosya kabul edilmiş sınırlamadır; silinmedi, EXCLUDED yapılmadı ve yeniden işlenmedi.
          - P01-11: erişilemeyen parçaların soluk gösterimi açık.
          - P01-12: arama açık.
          - Bu APK, Shell ile ortak release sertifikası kullanır.
          - Kurulum için Android 13+ (`minSdk 33`) gerekir; paket `com.theemrock.smoothmedia`.
          EOF
          gh release create "$GITHUB_REF_NAME" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "Smooth Media ${GITHUB_REF_NAME#smooth-media-p01-10c-interim-} (pre-release)" \
            --notes-file release-notes.md \
            --prerelease \
            --verify-tag

      - name: Remove temporary signing material
        if: always()
        run: rm -f "$RUNNER_TEMP/smooth-media-release.jks"
